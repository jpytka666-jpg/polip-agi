# darkstar-header-v1
# po co: Cargo.toml
# nie wolno: hotspot, ruszac wlp2s0, wracac do 10.44, gasic DARKSTAR-WiFi, haslo w gicie
# autor: Marcin
# powstal: 2026-09-05
[package]
name = "darkstar-seed"
version.workspace = true
edition.workspace = true
license.workspace = true

# Zero zaleznosci: format NWRD to naglowek i ciag liczb, a Noworodek zyje w innym
# repozytorium, ktorego nie wolno dotykac.
[dependencies]

# Glowne narzedzie: zasiew wag.
[[bin]]
name = "darkstar-seed"
path = "src/main.rs"

# Sprawdzenie, czy wpisane wektory znakow skladaja sie w sensowny opis calego zdania.
[[bin]]
name = "noworodek-embed"
path = "src/bin/noworodek_embed.rs"

# Pokazuje, czego warstwy nauczyly sie same - domyka petle wpisywania.
[[bin]]
name = "nwrd-diff"
path = "src/bin/nwrd_diff.rs"

# BAK_PAK_MAP_OF_BAK_FILES: mapa kopii zapasowych i porownywarka wersji.
[[bin]]
name = "bak-pak-map-of-bak-files"
path = "src/bin/bak_pak_map_of_bak_files.rs"
