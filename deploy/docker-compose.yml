# darkstar-header-v1
# po co: docker-compose.yml
# nie wolno: hotspot, ruszac wlp2s0, wracac do 10.44, gasic DARKSTAR-WiFi, haslo w gicie
# autor: Marcin
# powstal: 2026-09-01
services:
  darkstar:
    image: darkstar:dev
    container_name: darkstar
    environment:
      # network_mode: host - kontener dzieli stos sieciowy z maszyna, wiec 0.0.0.0
      # wystawiloby usluge takze na wlp2s0, czyli do sieci Vodafone. Wiazemy JAWNIE
      # na petle zwrotna; ekspozycji nie ogranicza juz mapowanie portow.
      DARKSTAR_HOST: 127.0.0.1
      DARKSTAR_PORT: ${DARKSTAR_HOST_PORT}
      DARKSTAR_HOST_PORT: ${DARKSTAR_HOST_PORT:?run ./deploy/port-manager/port-manager.sh allocate darkstar}
      # Bez tokenu kazda sciezka poza /health i /ready odpowiada 401 - fail-closed.
      # Wartosc zyje w deploy/.env (tryb 0600, ignorowany przez git), nigdy w repozytorium.
      DARKSTAR_API_TOKEN: ${DARKSTAR_API_TOKEN:?ustaw DARKSTAR_API_TOKEN w deploy/.env}
      # Przy sieci maszyny 127.0.0.1 kontenera JEST petla zwrotna hosta, wiec Chroma
      # zostaje tam, gdzie byla - bez nowego adresu nasluchu i bez zmiany zapory.
      DARKSTAR_CONTEXT_LOCAL: ${DARKSTAR_CONTEXT_LOCAL:-http://127.0.0.1:8000}
      DARKSTAR_CONTEXT_REMOTE: ${DARKSTAR_CONTEXT_REMOTE:-http://100.71.8.70:8000}
      # Worktree czytany przez GET /v1/git/overview. Sciezka jest KONTENEROWA i stala;
      # co jest pod nia podstawione, decyduje montaz nizej.
      DARKSTAR_GIT_WORKTREE: /srv/repo
      # Headscale przyjmuje JEDEN adres nasluchu. Odkad slucha na bramie prywatnej,
      # zeby inne wezly mialy jak sie polaczyc, petla zwrotna juz nie odpowiada - wiec
      # Darkstar pyta go dokladnie tam. Przy sieci hosta to ten sam komputer, ruch nie
      # opuszcza maszyny. To NIE jest adres publiczny i nie dotyka wlp2s0.
      DARKSTAR_HEADSCALE_URL: ${DARKSTAR_HEADSCALE_URL:-http://192.168.2.1:8080}
    # Bez mapowania portow: przy network_mode host wiazanie robi sam serwer (DARKSTAR_HOST).
    network_mode: host
    # Tylko gniazdo DBus i tylko do odczytu: nmcli w kontenerze pyta NetworkManagera
    # hosta o stan bramy. Warstwa mutujaca nie istnieje w kodzie, a montaz jest read-only.
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      # Repozytorium do odczytu. Zrodlo jest wzgledne wobec tego pliku (deploy/..), wiec
      # sciezka hosta nie jest wpisana w repo i dziala tak samo na kazdej kopii roboczej.
      # read-only: kontener ma widziec stan repozytorium, a nie moc go zmienic.
      - ..:/srv/repo:ro
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:${DARKSTAR_HOST_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
