# AUTHOR:              Claude Code agent, working for Marcin (jpytka666-jpg)
# AI MODEL:            Anthropic Claude via Claude Code remote session (exact model id WITHHELD by harness policy)
# TIMESTAMP:           2026-09-25T23:14:45Z
# REASON FOR CREATION: SCCE gate policy for polip-agi. Prose rules become transitions the harness decides.
# MECHANICS:           Read by aions-gate. 'gate FROM->TO name = cmd': exit 0 PASS, 3 UNKNOWN, other FAIL. 'open FROM->TO reason' declares a judgment-only transition explicitly, so it is visible rather than silently passed. 'repair gate = cmd' gives bounded recovery. 'exclude prefix reason' opts files out of provenance checks.
# SYSTEM PART:         polip-agi / workspace policy
# ARCHITECTURE FUNC:   Enforcement-plane policy data. Changing a gate here changes what the model is allowed to claim.
# DEPENDENCIES/LINKS:  crates/aions-gate/src/gates.rs; cargo; git
# TECH STACK:          aions-gate line config
# LOCAL WORKSPACE:     polip-agi/
# GIT COMMIT:          PENDING
# GITHUB METADATA:     jpytka666-jpg/polip-agi, branch claude/autonomous-automation-agent-ocxwke
# ================================================================================

timeout 900
max-repair 2

exclude .github/agents/ Copilot agent template, format defined by GitHub

# PRE_FLIGHT: canonical workspace and branch established
gate PRE_FLIGHT->SOURCE_OF_TRUTH_LOADED on-a-branch = test "$(git rev-parse --abbrev-ref HEAD)" != HEAD
gate PRE_FLIGHT->SOURCE_OF_TRUTH_LOADED config-valid = cargo run -q -p aions-gate -- check-config

# Judgment steps: not yet mechanically checkable. Declared, not hidden.
open SOURCE_OF_TRUTH_LOADED->TARGET_VERIFIED target identity is model judgment; no mechanical check yet
open TARGET_VERIFIED->DUPLICATE_SEARCHED duplicate search is model judgment; no mechanical check yet
open DUPLICATE_SEARCHED->PLAN_VALIDATED plan validation is model judgment; no mechanical check yet

# Mutation never happens on the default branch
gate PLAN_VALIDATED->EXECUTION_AUTHORIZED not-default-branch = b=$(git rev-parse --abbrev-ref HEAD); test "$b" != main && test "$b" != master
open EXECUTION_AUTHORIZED->MUTATION mutation is performed by the executor, verified by the following gates

gate MUTATION->TEST build = cargo build --workspace --quiet
gate TEST->REGRESSION_CHECK tests = cargo test --workspace --quiet
gate REGRESSION_CHECK->PROVENANCE_CHECK fmt = cargo fmt --all --check
repair fmt = cargo fmt --all
gate PROVENANCE_CHECK->STATE_UPDATE provenance = cargo run -q -p aions-gate -- provenance --since origin/main

# Persistent changes must be committed and pushed before landing
gate STATE_UPDATE->LANDING committed = test -z "$(git status --porcelain)"
gate STATE_UPDATE->LANDING pushed = test "$(git rev-parse HEAD)" = "$(git rev-parse @{u})"

# LANDED means the work is in origin/main, not merely on a branch
gate LANDING->POST_FLIGHT_VERIFY in-main = git fetch -q origin main && git merge-base --is-ancestor HEAD origin/main
gate POST_FLIGHT_VERIFY->COMPLETE retest = cargo test --workspace --quiet
