# WNIOSEK: para Headplane 0.7.1 + Headscale 0.29.3 jest zgodna wedlug regul upstreamu.
# NIEZWERYFIKOWANE: upstream nigdzie nie stwierdza wprost "0.29.3". Potwierdzenie przebiegiem
