name: aions-gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup component add rustfmt
      - name: build
        run: cargo build --workspace --locked
      - name: tests
        run: cargo test --workspace --locked
      - name: fmt
        run: cargo fmt --all --check
      - name: provenance (files added/changed vs base)
        if: github.event_name == 'pull_request'
        run: cargo run -q -p aions-gate -- provenance --since "origin/${{ github.base_ref }}"
