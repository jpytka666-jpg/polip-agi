# ---- Procedura aktualizacji ---------------------------------------------
# 1. Odczytaj nowe wydanie: GitHub API /repos/tale/headplane/releases.
# 2. Sprawdz w informacjach o wydaniu wymagane minimum Headscale oraz stala HS_VERSIONS
#    w tests/integration/setup/env.ts nowego tagu. Jesli minimum przekracza wersje Headscale
#    dzialajaca na hoscie - STOP. Najpierw mesh, dopiero potem panel.
# 3. Pobierz digest indeksu: token ghcr.io, nastepnie HEAD /v2/tale/headplane/manifests/<tag>
#    i naglowek docker-content-digest.
# 4. Potwierdz, ze etykieta org.opencontainers.image.revision obrazu rowna sie commitowi tagu.
# 5. Zaktualizuj ten plik i compose.yml w jednym commicie. Nigdy tylko jedno z dwojga.
# 6. Uruchom deploy/headplane/verify przed i po. Zapisz oba wyniki.

# ---- Procedura wycofania -------------------------------------------------
# 1. Odczytaj poprzedni container_image_ref z historii gita: git log -p deploy/headplane/version.lock
# 2. Zatrzymaj sam panel: docker compose -f deploy/headplane/compose.yml down
#    (to nie dotyka kontenera darkstar-headscale ani jego wolumenow)
# 3. Przywroc compose.yml i version.lock z poprzedniego commita, uruchom panel ponownie.
# 4. Katalog danych panelu przezywa wycofanie. Jesli nowsza wersja zmigrowala baze panelu,
#    wycofanie wymaga kopii wolumenu sprzed aktualizacji - zrob ja PRZED krokiem 5 aktualizacji.
# 5. Headscale nie jest w tej procedurze ruszany w zaden sposob. Panel jest wymienny, mesh nie.
rollback_touches_headscale = no

# ---- Stan na hoscie CBMS, zmierzony 2026-09-04 --------------------------
