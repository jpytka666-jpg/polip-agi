# Werdykt - rozdzielony na fakt i wniosek, bo to nie to samo:
# FAKT 1: 0.29.3 spelnia minimum 0.27.0 upstreamu.
# FAKT 2: 0.29.3 NIE wystepuje w macierzy testow integracyjnych upstreamu (konczy sie na 0.29.1).
# FAKT 3: od 0.7.0 wykrywanie mozliwosci Headscale idzie przez endpoint /version i porownanie
#         "wieksze lub rowne" (app/server/headscale/api/capabilities.ts), wiec 0.29.3 dostaje
