# Adres serwera Headscale — reachable z prywatnej sieci Darkstar
server_url: http://192.168.2.1:8080
# Nasluch na bramie prywatnej 192.168.2.1 - bez tego zaden inny wezel nie ma jak sie
# polaczyc. Compose stoi w sieci hosta, wiec to jest adres HOSTA. To NADAL nie jest
# 0.0.0.0: wlp2s0 i siec nadrzedna Vodafone pozostaja nietkniete. Petla zwrotna przestaje
# odpowiadac - headscale przyjmuje jeden adres nasluchu - wiec Darkstar pyta go pod 192.168.2.1.
listen_addr: 192.168.2.1:8080

# Katalog danych — przechowuje bazę danych, klucze, meta
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

# Katalog stanu runtime
state_dir: /var/lib/headscale

# Ścieżka do pliku polityki
policy_path: /etc/headscale/policy.hujson

# Adresy routerów z basenu (tutaj pusty, będą wygenerowane przy starcie)
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

# Logowanie
log:
  level: info
  format: json

# Klucz protokolu Noise. Headscale 0.29 odmawia startu bez tej sciezki - zmierzone,
# nie zgadniete: "headscale now requires a new noise.private_key_path field".
# Klucz powstaje sam przy pierwszym starcie i zyje w wolumenie, nigdy w repozytorium.
noise:
  private_key_path: /var/lib/headscale/noise_private.key

# DNS dla węzłów — bez dostępu do publicznych serwerów
dns:
  # Bez tego Headscale odmawia startu: "dns.nameservers.global must be set when
  # dns.override_local_dns is true". Wybor jest swiadomy - NIE przejmujemy DNS-u
  # klientom. Przejecie zmienialoby rozwiazywanie nazw na maszynach w domu, czyli
  # dokladnie ta klase zmiany, ktorej ten host ma nie robic.
  override_local_dns: false
  magic_dns: false
  base_domain: darkstar.local

# DERP — private relay nodes do tunelowania jeśli nie ma direct connectivity
derp:
  server:
    enabled: false
  urls:
    # Wyłącz publiczne DERP relaye — klient testowy będzie używać direct/local relay
    - https://controlplane.tailscale.com/derpmap/default

# Adresy UDP dla tunnel discovery — bind na loopback i bramę prywatną
metrics:
  enable: false

# tuning
max_clients_per_user: 100

# Minimum client version — z version.lock
min_version: 1.80.0

# Aby uniknąć wysyłania telemetrii na serwery Tailscale
disable_check_updates: true
