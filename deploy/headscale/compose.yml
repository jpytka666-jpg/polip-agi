version: "3.8"

services:
  headscale:
    image: headscale/headscale:v0.29.3
    container_name: darkstar-headscale
    restart: unless-stopped

    ports:
      # HTTP API + Web UI — bind TYLKO na loopback i brama prywatna
      - "127.0.0.1:8080:8080/tcp"
      - "192.168.2.1:8080:8080/tcp"
      # gRPC API — bind TYLKO na loopback i brama prywatna
      - "127.0.0.1:50443:50443/tcp"
      - "192.168.2.1:50443:50443/tcp"

    volumes:
      # Konfiguracja — zamapowana z hosta
      - ./config.yaml:/etc/headscale/config.yaml:ro
      # Polityka — zamapowana z hosta
      - ./policy.hujson:/etc/headscale/policy.hujson:ro
      # Baza danych — persistent storage
      - headscale_data:/var/lib/headscale
      # Run directory dla socket'ów
      - headscale_run:/var/run/headscale

    environment:
      # Logowanie
      LOG_LEVEL: "info"
      # Konfiguracja jest obsługiwana przez plik config.yaml

    networks:
      - darkstar

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  headscale_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HEADSCALE_DATA_DIR:-/var/lib/darkstar/headscale}

  headscale_run:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HEADSCALE_RUN_DIR:-/run/darkstar/headscale}

networks:
  darkstar:
    name: darkstar
    external: true
