services:
  darkstar:
    image: darkstar:dev
    container_name: darkstar
    environment:
      DARKSTAR_HOST: 0.0.0.0
      DARKSTAR_PORT: 8080
    ports:
      - "8080:8080"
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
