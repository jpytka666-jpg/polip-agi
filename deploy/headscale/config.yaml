# Adres serwera Headscale — reachable z prywatnej sieci Darkstar
server_url: http://127.0.0.1:8080

# Port nasluchu HTTP API — ograniczony do loopback; compose.yml bind'uje na host
# UWAGA - to adres WEWNATRZ kontenera, nie na hoscie.
# 127.0.0.1 oznaczaloby tu petle zwrotna samego kontenera, wiec mapowanie portow
# z compose.yml nigdy by nie zadzialalo i usluga bylaby nieosiagalna.
# Ekspozycje ogranicza compose: porty sa mapowane wylacznie na 127.0.0.1 i 192.168.2.1
# hosta, dokladnie tak jak robi to dzialajacy darkstar (DARKSTAR_HOST: 0.0.0.0 + mapowanie).
listen_addr: 127.0.0.1:8080

# Katalog danych — przechowuje bazę danych, klucze, meta
db_type: sqlite
db_path: /var/lib/headscale/db.sqlite

# Katalog stanu runtime
state_dir: /var/lib/headscale

# Ścieżka do pliku polityki
policy_path: /etc/headscale/policy.hujson

# Adresy routerów z basenu (tutaj pusty, będą wygenerowane przy starcie)
ip_prefixes:
  - fd7a:115c:a1e0::/48
  - 100.64.0.0/10

# Logowanie
log:
  level: info
  format: json

# DNS dla węzłów — bez dostępu do publicznych serwerów
dns:
  base_domains:
    - darkstar.local

# DERP — private relay nodes do tunelowania jeśli nie ma direct connectivity
derp:
  server:
    enabled: false
  urls:
    # Wyłącz publiczne DERP relaye — klient testowy będzie używać direct/local relay
    - https://controlplane.tailscale.com/derpmap/default

# Adresy UDP dla tunnel discovery — bind na loopback i bramę prywatną
metrics:
  enable: false

# tuning
max_clients_per_user: 100

# Minimum client version — z version.lock
min_version: 1.80.0

# Aby uniknąć wysyłania telemetrii na serwery Tailscale
disable_check_updates: true
