version: "3.8"

services:
  headscale:
    image: headscale/headscale:v0.29.3
    container_name: darkstar-headscale
    restart: unless-stopped

    # Siec hosta zamiast mostka z publikowaniem portow. Powod jest twardy: ten host jest
    # brama domowa. Wlasna siec dockerowa dokladalaby nowy mostek i reguly przekierowania
    # do zywej maszyny routujacej. network_mode: host nie dodaje ANI JEDNEJ reguly -
    # nasluch ustala wylacznie listen_addr w config.yaml, ustawiony na 127.0.0.1.
    # 0.0.0.0 jest tu zakazane podwojnie: przy sieci hosta wystawiloby usluge takze na
    # wlp2s0, czyli do sieci nadrzednej Vodafone.
    network_mode: host

    volumes:
      # Konfiguracja — zamapowana z hosta
      - ./config.yaml:/etc/headscale/config.yaml:ro
      # Polityka — zamapowana z hosta
      - ./policy.hujson:/etc/headscale/policy.hujson:ro
      # Baza danych — persistent storage
      - headscale_data:/var/lib/headscale
      # Run directory dla socket'ów
      - headscale_run:/var/run/headscale

    environment:
      # Logowanie
      LOG_LEVEL: "info"
      # Konfiguracja jest obsługiwana przez plik config.yaml

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Zwykle wolumeny dockerowe zamiast montazu katalogow hosta. Dwa powody, oba twarde:
# zalozenie /var/lib/darkstar i /run/darkstar wymaga roota, a /run to tmpfs - katalog
# gniazd znikalby przy kazdym restarcie maszyny i baza wstawalaby w niepelnym stanie.
# Docker zaklada te wolumeny sam, bez podnoszenia uprawnien, i przezywaja restart.
volumes:
  headscale_data:
  headscale_run:
