name: Darkstar Format Fix (one-shot)

on:
  push:
    branches:
      - feat/darkstar-system-graph
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/darkstar-system-graph
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git add -- '*.rs'
          git commit -m "chore(darkstar): apply rustfmt to live graph"
          git push origin HEAD:feat/darkstar-system-graph
